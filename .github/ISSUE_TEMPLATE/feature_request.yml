name: Feature request
description: Suggest an improvement to Epic Stocks
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include personal financial information, actual share prices, statements, or unredacted screenshots.
  - type: textarea
    attributes:
      label: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    attributes:
      label: What would make this easier?
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Privacy
      options:
        - label: I have removed personal and confidential financial information.
          required: true
