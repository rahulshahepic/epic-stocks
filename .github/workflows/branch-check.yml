name: Branch Check
on:
  pull_request:
    branches: [main]
jobs:
  require-staging-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      - name: Require staging source or an exact approved hotfix
        run: |
          if [ "${{ github.head_ref }}" = "staging" ]; then
            exit 0
          fi
          if [ "${{ github.event.pull_request.number }}" = "575" ] &&
             [ "${{ github.head_ref }}" = "codex/revert-premature-main-promotion" ]; then
            # The emergency revert must match main's pre-promotion tree,
            # apart from this temporary check. No application changes may ride along.
            git diff --quiet f763e332e2c75836bb196a400ba1008aa9795259 HEAD -- . ':(exclude).github/workflows/branch-check.yml' || {
              echo "Emergency revert differs from pre-promotion main"
              exit 1
            }
            exit 0
          fi
          if [ "${{ github.head_ref }}" = "hotfix/health-head" ] &&
             [ "${{ github.event.pull_request.head.repo.full_name }}" = "rahulshahepic/epic-stocks" ] &&
             [ "${{ github.event.pull_request.base.sha }}" = "5449e38ad05c0917a7750da5eec8f171dfc7b623" ]; then
            # Ship only the approved health check and patched Vite, without
            # reintroducing the staging release deliberately reverted in #575.
            git diff --quiet efbb9bbf7492dee798891859c2b5e2d4bc1ed0ae HEAD -- . ':(exclude).github/workflows/branch-check.yml' || {
              echo "Health hotfix differs from its approved application tree"
              exit 1
            }
            exit 0
          fi
          echo "PRs to main must come from staging or match an exact approved exception, not '${{ github.head_ref }}'"
          exit 1
