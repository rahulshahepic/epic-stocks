name: Capture retirement and life-events screenshots
on:
  push:
    branches:
      - fix/life-events-month-boundaries-and-replacements

permissions:
  contents: write

jobs:
  screenshots:
    if: ${{ !contains(github.event.head_commit.message, '[screenshots]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install frontend dependencies and Chromium
        run: |
          cd frontend
          npm ci --no-audit
          npx playwright install chromium
      - name: Run repository screenshot script against synthetic database
        run: ./screenshots/run.sh
      - name: Commit captured retirement and life-event screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add screenshots/retirement-*.png screenshots/life-events-planner-*.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs(screenshots): capture real retirement planner views [screenshots]'
            git push origin HEAD:fix/life-events-month-boundaries-and-replacements
          else
            echo 'Retirement screenshots unchanged'
          fi
