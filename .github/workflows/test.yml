name: Test
on:
  pull_request:
# No `push:` trigger. Branch protection on main and staging already requires
# the `backend`, `frontend`, `e2e`, and `caddy-validate` checks to pass on the
# incoming PR, and all merges to main must come from staging (enforced by
# branch-check.yml). Re-running the same tests on the merge commit doubles CI
# cost with no additional signal — the PR run already tested the same code.
#
# The consequence to know about: a cache written by a PR run is scoped to that
# PR's ref, and other PRs can only restore caches written on their base branch.
# With nothing running on staging, every restore here missed and every run
# re-installed from scratch. warm-cache.yml now populates these caches on pushes
# to staging/main — keep its cache keys byte-identical to the ones below, or the
# restores go back to silently missing.
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - name: Cache status
        run: echo "pip cache-hit=${{ steps.setup-python.outputs.cache-hit }}"
      - name: Install deps
        run: |
          echo "::group::pip install"
          time pip install -r backend/requirements.txt pytest pytest-asyncio httpx
          echo "::endgroup::"
      - name: Check import boundaries
        run: |
          echo "::group::import-linter"
          cd backend && time lint-imports
          echo "::endgroup::"
      - name: Run tests
        run: |
          echo "::group::pytest"
          time pytest backend/tests/ -v --durations=20
          echo "::endgroup::"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Cache status
        run: echo "npm cache-hit=${{ steps.setup-node.outputs.cache-hit }}"
      - name: Update npm
        # Node 20's bundled npm is 10.x, which still falls back to the retired
        # /-/npm/v1/security/audits/quick endpoint (see --no-audit below). npm
        # 11.0.0 removed that fallback entirely (npm/cli#7911); 11.19.1 is the
        # newest 11.x release, still within Node 20's supported range
        # (^20.17.0 || >=22.9.0) so nothing else about the toolchain changes.
        run: npm install -g npm@11.19.1
      - name: Install deps
        # --no-audit: even on npm 11, ci's own built-in audit report duplicates
        # the check the next step already makes against the bulk endpoint —
        # this just skips the redundant network round trip.
        run: cd frontend && time npm ci --no-audit
      - name: Type-check
        run: cd frontend && time npx tsc -b --noEmit
      - name: Audit production dependencies
        # Scope: production packages only (--omit=dev), so build-tool CVEs (vite,
        # babel, playwright) cannot block an unrelated PR — this app is a browser
        # SPA and dev-only packages never reach a user.
        #
        # This goes through `npm audit` rather than posting to the advisory
        # endpoint by hand. npm owns which endpoint is current: when the registry
        # retired /-/npm/v1/security/audits{,/quick} after 2026-07-15, npm 11
        # moved to the replacement (npm/cli#7911) and dropped the fallback that
        # made npm 10 hang. Hand-rolling the request bought us nothing npm does
        # not already do, and left us to track endpoint changes ourselves.
        #
        # The endpoint is intermittently slow, so each attempt is capped and
        # retried. `npm audit` exits non-zero both for "found vulnerabilities"
        # and for "could not reach the registry"; only a report carrying
        # auditReportVersion distinguishes them, which is also what keeps a
        # lookup failure from being reported as a clean bill of health.
        #
        # GHSA-qwww-vcr4-c8h2 (react-router RSC Mode CSRF Bypass) is allowlisted:
        # it only affects React Router's RSC/framework mode, which this client-only
        # SPA (BrowserRouter) does not use, and react-router-dom has no non-breaking
        # fix yet (v8 only ships under the renamed "react-router" package). Remove
        # the entry once react-router-dom publishes a >=8.3.0-equivalent fix.
        run: |
          cd frontend
          ALLOWED='["https://github.com/advisories/GHSA-qwww-vcr4-c8h2"]'

          for attempt in 1 2 3; do
            timeout 60 npm audit --omit=dev --json > /tmp/audit.json 2>/tmp/audit.err || true
            if jq -e '.auditReportVersion' /tmp/audit.json > /dev/null 2>&1; then break; fi
            echo "Advisory lookup attempt $attempt returned no report; retrying." >&2
            sleep $((attempt * 15))
          done

          if ! jq -e '.auditReportVersion' /tmp/audit.json > /dev/null 2>&1; then
            echo "::error::Advisory lookup failed - refusing to report a clean audit."
            head -c 500 /tmp/audit.json /tmp/audit.err || true
            exit 1
          fi

          echo "Audited production dependencies: $(jq -c '.metadata.vulnerabilities' /tmp/audit.json)"

          UNADDRESSED=$(jq --argjson allowed "$ALLOWED" '
            [ .vulnerabilities[]
              | select(.severity == "high" or .severity == "critical")
              | .via[]? | objects | .url ]
            | unique
            | . - $allowed
          ' /tmp/audit.json)

          if [ "$UNADDRESSED" != "[]" ]; then
            echo "Unaddressed high/critical advisories in production dependencies:" >&2
            echo "$UNADDRESSED" >&2
            jq -r '.vulnerabilities[]
                   | select(.severity == "high" or .severity == "critical")
                   | .name as $pkg | .via[]? | objects
                   | "  \(.severity)  \($pkg)  \(.title)  \(.url)"' /tmp/audit.json >&2
            exit 1
          fi
          echo "No unaddressed high/critical advisories (allowlisted: $ALLOWED)"
      - name: Run tests
        run: cd frontend && time npm run test

  caddy-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "$PWD/caddy:/etc/caddy:ro" \
            -e TRUSTED_PROXY_IPS=127.0.0.1/32 \
            -e DOMAIN=localhost \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile

  e2e:
    runs-on: ubuntu-latest
    # Playwright runs on the runner, not in a container. The old approach pulled
    # mcr.microsoft.com/playwright:v1.56.0-jammy (~1.3 GB) every build, which
    # dominated e2e wall clock because the GHA layer cache does not round-trip
    # multi-GB base images reliably. Runner-based Playwright with a cached
    # ~/.cache/ms-playwright directory avoids that entirely.
    steps:
      - uses: actions/checkout@v4
      - name: Start e2e-db (parallel with npm / buildx / image build)
        # Postgres has no dependency on the e2e-app image, so start it immediately.
        # By the time the e2e-app image finishes building, the db healthcheck has
        # already passed and `docker compose up e2e-app` doesn't wait on it.
        run: docker compose -f docker-compose.e2e.yml up -d e2e-db
      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Update npm
        # See the frontend job's Update npm step for why.
        run: npm install -g npm@11.19.1
      - name: Install frontend deps
        # See the frontend job's Install deps step for why --no-audit.
        run: cd frontend && time npm ci --no-audit
      - name: Cache playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install playwright browsers
        # No --with-deps: the ubuntu-24.04 runner ships libnss3 / libxkbcommon /
        # libatk etc. already. `--with-deps` costs ~16 s of `sudo apt update` +
        # "already the newest version" for every lib on every run. If Playwright
        # ever fails with a missing system lib, add the specific package here.
        run: |
          echo "pw browser cache-hit=${{ steps.pw-cache.outputs.cache-hit }}"
          cd frontend && time npx playwright install chromium
      - uses: docker/setup-buildx-action@v3
      - name: Build e2e-app image (cached)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: epic-stocks-e2e-app:ci
          cache-from: type=gha,scope=e2e-app
          cache-to: type=gha,mode=max,scope=e2e-app
      - name: Start backend
        run: |
          docker compose -f docker-compose.e2e.yml up -d e2e-app
          # Wait for the container's own internal healthcheck to reach "healthy".
          # The container healthcheck runs curl inside Docker where localhost is
          # always 127.0.0.1 (IPv4 only). This avoids the host-side ambiguity
          # where Node 20 / curl may resolve localhost to ::1 (IPv6) while Docker
          # only binds the port on 127.0.0.1. Two minutes covers slow Alembic
          # migrations on resource-constrained runners.
          CID=$(docker compose -f docker-compose.e2e.yml ps -q e2e-app)
          echo "Waiting for backend container $CID to become healthy (up to 120s)..."
          for i in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' "$CID" 2>/dev/null || echo "starting")
            if [ "$status" = "healthy" ]; then
              echo "Backend healthy after $((i * 2))s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "Backend did not become healthy within 120s — dumping logs:"
              docker compose -f docker-compose.e2e.yml logs e2e-app
              exit 1
            fi
            sleep 2
          done
      - name: Run e2e tests
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_API_URL: http://127.0.0.1:8000
        run: cd frontend && time npx playwright test
      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs e2e-app
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
