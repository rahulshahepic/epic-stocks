<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1440" viewBox="0 0 1120 1440"><rect width="1120" height="1440" fill="#f2f5f2"/><style>text{font-family:Arial,sans-serif;fill:#24362f}.head{font-size:22px;font-weight:bold}.line{font-size:17px}.muted{font-size:14px;fill:#52655b}</style><rect x="30" y="30" width="510" height="440" rx="18" fill="white" stroke="#c8d2cb"/><text x="54" y="66" class="muted">01 · First-time import</text><text x="60" y="107" class="head" >Understand your Epic stock.</text><text x="60" y="152" class="line" >See what you own, owe and could walk away with.</text><text x="60" y="197" class="line" >Data for Stock Workbook</text><rect x="50" y="216" width="470" height="36" rx="8" fill="#edf2ee"/><text x="60" y="242" class="line" >↓  Drop your workbook here</text><text x="60" y="287" class="line" >Latest Stock Loan Statement · optional</text><rect x="50" y="306" width="470" height="36" rx="8" fill="#edf2ee"/><text x="60" y="332" class="line" >↓  Drop your statement here</text><rect x="50" y="351" width="470" height="36" rx="8" fill="#365e50"/><text x="60" y="377" class="line" style="fill:white">Show me my stock position</text><text x="60" y="422" class="line" >No account required · See an example instead</text><rect x="580" y="30" width="510" height="440" rx="18" fill="white" stroke="#c8d2cb"/><text x="604" y="66" class="muted">02 · Fictional demo</text><text x="610" y="107" class="head" >Explore without uploading anything</text><text x="610" y="152" class="line" >Early career · 3 years</text><text x="610" y="197" class="line" >First purchase grant, loans and vesting</text><text x="610" y="242" class="line" >Established employee · 10 years</text><text x="610" y="287" class="line" >Multiple grants, bonus shares, loan repayments</text><text x="610" y="332" class="line" >Planning an exit · 20 years</text><text x="610" y="377" class="line" >Exit taxes, financial independence and retirement</text><text x="610" y="422" class="line" >Choose a profile · All data is fictional</text><rect x="30" y="500" width="510" height="440" rx="18" fill="white" stroke="#c8d2cb"/><text x="54" y="536" class="muted">03 · Question-oriented dashboard</text><text x="60" y="577" class="head" >Estimated proceeds if you left Epic today</text><text x="60" y="622" class="line" >$218,000</text><text x="60" y="667" class="line" >Vested stock value                         $450,000</text><text x="60" y="712" class="line" >Outstanding loans and interest      −$170,000</text><text x="60" y="757" class="line" >Estimated taxes                              −$62,000</text><text x="60" y="802" class="line" >Next vesting · Oct 1, 2027</text><text x="60" y="847" class="line" >Next loan payoff · Dec 2028</text><text x="60" y="892" class="line" >Illustrative estimates · See calculation details</text><rect x="580" y="500" width="510" height="440" rx="18" fill="white" stroke="#c8d2cb"/><text x="604" y="536" class="muted">04 · Import confidence</text><text x="610" y="577" class="head" >Your import looks good</text><text x="610" y="622" class="line" >✓  Stock grants identified · 12 grants</text><text x="610" y="667" class="line" >✓  Vested share count reconciled</text><text x="610" y="712" class="line" >✓  Outstanding loans reconciled</text><text x="610" y="757" class="line" >✓  Accrued interest reconciled</text><text x="610" y="802" class="line" >One item needs your attention</text><text x="610" y="847" class="line" >Loan statement is two months old.</text><text x="610" y="892" class="line" >Interest since then will be estimated.</text><rect x="30" y="970" width="510" height="440" rx="18" fill="white" stroke="#c8d2cb"/><text x="54" y="1006" class="muted">05 · Retirement essentials</text><text x="60" y="1047" class="head" >Plan your retirement</text><text x="60" y="1092" class="line" >Basic   |   Advanced</text><text x="60" y="1137" class="line" >Retirement date · January 2045</text><rect x="50" y="1156" width="470" height="36" rx="8" fill="#edf2ee"/><text x="60" y="1182" class="line" >Projected Epic proceeds · $2,450,000</text><text x="60" y="1227" class="line" >Other assets at retirement · $600,000</text><text x="60" y="1272" class="line" >Annual household spending · $100,000</text><text x="60" y="1317" class="line" >Epic share growth assumption · 10%</text><rect x="50" y="1336" width="470" height="36" rx="8" fill="#365e50"/><text x="60" y="1362" class="line" style="fill:white">Explore my retirement</text><rect x="580" y="970" width="510" height="440" rx="18" fill="white" stroke="#c8d2cb"/><text x="604" y="1006" class="muted">06 · Onboarding funnel</text><text x="610" y="1047" class="head" >Proposed targets, not measured results</text><text x="610" y="1092" class="line" >100   Start import</text><text x="610" y="1137" class="line" >90     Upload valid documents</text><text x="610" y="1182" class="line" >85     See financial position</text><text x="610" y="1227" class="line" >60     Create account</text><text x="610" y="1272" class="line" >40     Enable useful reminders</text><text x="610" y="1317" class="line" >Primary measure: accurate position in five minutes</text><text x="610" y="1362" class="line" >Never collect financial values in analytics</text></svg>