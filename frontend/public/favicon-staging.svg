<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="barShadow" x="-5%" y="-5%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <linearGradient id="barShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,1.0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.88)"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="#D97706"/>
  <rect x="80"  y="322" width="208" height="70" rx="12" fill="url(#barShine)" filter="url(#barShadow)"/>
  <rect x="132" y="222" width="234" height="70" rx="12" fill="url(#barShine)" filter="url(#barShadow)"/>
  <rect x="184" y="122" width="260" height="70" rx="12" fill="url(#barShine)" filter="url(#barShadow)"/>
  <!-- Staging badge: dark amber pill, top-right, above the bars -->
  <rect x="348" y="30" width="134" height="76" rx="38" fill="#78350F"/>
  <text x="415" y="82" font-family="system-ui,-apple-system,sans-serif" font-size="60" font-weight="900" text-anchor="middle" fill="white">S</text>
</svg>
